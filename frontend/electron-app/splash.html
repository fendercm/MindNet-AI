<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
    overflow: hidden;
    user-select: none;
  }
  .logo    { font-size: 52px; margin-bottom: 14px; }
  .title   { font-size: 24px; font-weight: 800; color: #a78bfa; letter-spacing: -0.5px; margin-bottom: 6px; }
  .sub     { font-size: 12px; color: #475569; margin-bottom: 32px; }
  .status  { font-size: 13px; color: #94a3b8; margin-bottom: 18px; min-height: 20px; }
  .bar-wrap{ width: 280px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .bar     { height: 100%; background: linear-gradient(90deg,#6c63ff,#a78bfa); border-radius: 2px; width: 0%; transition: width .35s ease; }
</style>
</head>
<body>
  <div class="logo">🧠</div>
  <div class="title">MindNet AI</div>
  <div class="sub">Граф знаний</div>
  <div class="status" id="status">Инициализация...</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <script>
    const { ipcRenderer } = require('electron')
    ipcRenderer.on('status', (_, { text, pct }) => {
      document.getElementById('status').textContent = text
      document.getElementById('bar').style.width = pct + '%'
    })
  </script>
</body>
</html>
